[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medilux-api"
version = "0.1.0"
description = "FastAPI foundation for MEDILUX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
